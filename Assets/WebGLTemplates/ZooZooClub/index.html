<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #abdaf6; overflow: hidden; overscroll-behavior: none; }
    /* 태블릿·휴대폰: 게임 화면을 누르고 끌 때 브라우저가 화면을 확대하거나 밀거나 길게 눌러 메뉴를 띄우지 않게 한다. */
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    /* 휴대폰을 세로로 들면 화면이 너무 좁아서, 가로로 돌려 달라고 알려 준다. */
    #rotate-hint {
      display: none; z-index: 200; position: fixed; inset: 0; background: #abdaf6;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #5c3a21; font-size: 22px; font-weight: bold;
    }
    #rotate-hint small { font-size: 15px; color: #967658; font-weight: normal; }
    @media (orientation: portrait) and (pointer: coarse) and (max-width: 820px) {
      #rotate-hint { display: flex; }
    }
    #loading {
      /* 게임이 올라오면서 만드는 이름 입력 칸(z-index 10)보다 위에 둔다. 다 불러오기 전에는 보이면 안 된다. */
      z-index: 100;
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #5c3a21; font-size: 20px;
    }
    #bar { width: 320px; height: 20px; border: 3px solid #5c3a21; border-radius: 12px; overflow: hidden; background: #fff7e2; }
    #fill { height: 100%; width: 0; background: #84ce54; transition: width 0.2s; }
    #message { font-size: 15px; color: #967658; max-width: 520px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="rotate-hint">
    <div style="font-size:56px">📱↻</div>
    <div>화면을 가로로 돌려 주세요</div>
    <small>Zoo Zoo Club은 가로 화면에서 해요.</small>
  </div>
  <div id="loading">
    <div>Zoo Zoo Club 불러오는 중…</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="message">처음에는 시간이 조금 걸려요. 창을 닫지 말고 기다려 주세요.</div>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    // iOS 사파리는 user-scalable=no를 무시하므로, 두 손가락 확대와 두 번 톡톡 확대를 직접 막는다.
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    var lastTouchEnd = 0;
    document.addEventListener("touchend", function (e) {
      var now = Date.now();
      if (now - lastTouchEnd < 350 && e.target === canvas) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    var config = {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      // 저장 파일이 브라우저 저장소(IndexedDB)에 자동으로 남도록 한다.
      autoSyncPersistentDataPath: true
    };

    createUnityInstance(canvas, config, function (progress) {
      document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
    }).then(function (unityInstance) {
      document.querySelector("#loading").remove();
      // 탭을 닫거나 다른 창으로 가기 직전에 바뀐 것을 저장한다.
      var saveNow = function () { try { unityInstance.SendMessage("ZooZooClub", "SaveNow"); } catch (e) {} };
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") saveNow(); });
      window.addEventListener("pagehide", saveNow);
      window.addEventListener("beforeunload", saveNow);
    }).catch(function (message) {
      document.querySelector("#message").textContent = "불러오지 못했어요: " + message;
    });
  </script>
</body>
</html>
