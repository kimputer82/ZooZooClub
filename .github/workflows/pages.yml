# 저장소의 Web/ 폴더(웹 빌드 결과)를 GitHub Pages로 공개한다.
# main에 푸시할 때마다 자동으로 올라간다(1분 정도 걸린다). 저장소 설정 > Pages > Source 를 "GitHub Actions"로 한 번만 바꿔 두면 된다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web
      - id: deployment
        uses: actions/deploy-pages@v4
