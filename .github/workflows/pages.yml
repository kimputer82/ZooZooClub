# (지금은 쓰지 않는다) Web/ 폴더만 GitHub Pages로 올리는 워크플로.
# 현재는 저장소 설정 > Pages > Source 가 "Deploy from a branch"(main, root)라서 저장소 전체가 그대로 올라가고,
# 게임 주소는 https://kimputer82.github.io/ZooZooClub/Web/ 이다(저장소 맨 위의 index.html이 그리로 넘겨 준다).
# Source 를 "GitHub Actions"로 바꾸면 이 워크플로를 Actions 탭에서 수동(Run workflow)으로 돌려 쓸 수 있다.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web
      - id: deployment
        uses: actions/deploy-pages@v4
